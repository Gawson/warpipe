<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>How Warpipe works</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#27ae60"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="330" rx="14" fill="#f6f8fa"/>

  <!-- apps -->
  <g font-size="15" font-weight="600" fill="#1f2328">
    <rect x="24" y="52" width="150" height="46" rx="9" fill="#ffffff" stroke="#d0d7de"/>
    <text x="99" y="81" text-anchor="middle">🎮 Game</text>
    <rect x="24" y="142" width="150" height="46" rx="9" fill="#ffffff" stroke="#d0d7de"/>
    <text x="99" y="171" text-anchor="middle">🌐 Browser</text>
    <rect x="24" y="232" width="150" height="46" rx="9" fill="#ffffff" stroke="#d0d7de"/>
    <text x="99" y="261" text-anchor="middle">🎵 Music</text>
  </g>

  <!-- what you hear -->
  <g font-size="14" fill="#1f2328">
    <rect x="300" y="20" width="200" height="40" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="400" y="45" text-anchor="middle">Effects (e.g. EasyEffects)</text>
    <rect x="600" y="20" width="196" height="40" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="698" y="45" text-anchor="middle">🎧 Your headphones</text>
  </g>
  <g stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M174,70 C230,70 250,40 298,40"/>
    <path d="M174,160 C240,160 250,46 298,44"/>
    <path d="M174,250 C250,250 260,52 298,50"/>
    <path d="M500,40 L598,40"/>
  </g>
  <text x="400" y="80" text-anchor="middle" font-size="12" fill="#6b7280">you still hear everything</text>

  <!-- discord captures -->
  <g font-size="13" fill="#1f2328">
    <rect x="300" y="110" width="200" height="34" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="400" y="132" text-anchor="middle" font-family="monospace">discord_capture #1</text>
    <rect x="300" y="168" width="200" height="34" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="400" y="190" text-anchor="middle" font-family="monospace">discord_capture #2</text>
    <rect x="300" y="226" width="200" height="34" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="400" y="248" text-anchor="middle" font-family="monospace">discord_capture #3</text>
  </g>
  <text x="400" y="290" text-anchor="middle" font-size="12" fill="#6b7280">Discord opens one capture stream per playing app</text>

  <!-- links into captures -->
  <path d="M174,80 C240,80 250,127 298,127" stroke="#27ae60" stroke-width="3" fill="none" marker-end="url(#arrg)"/>
  <path d="M174,170 C240,170 250,185 298,185" stroke="#d1d5db" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/>
  <path d="M174,260 C240,260 250,243 298,243" stroke="#d1d5db" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/>
  <g stroke="#e5484d" stroke-width="3" stroke-linecap="round">
    <path d="M232,170 l12,12 M244,170 l-12,12"/>
    <path d="M232,248 l12,12 M244,248 l-12,12"/>
  </g>

  <!-- go live -->
  <rect x="600" y="160" width="196" height="50" rx="10" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="698" y="183" text-anchor="middle" font-size="15" font-weight="700" fill="#1e7e46">Discord Go Live</text>
  <text x="698" y="201" text-anchor="middle" font-size="12" fill="#1e7e46">viewers hear only the game</text>
  <g stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M500,127 C550,127 560,178 598,180"/>
    <path d="M500,185 L598,185"/>
    <path d="M500,243 C550,243 560,192 598,190"/>
  </g>

  <!-- warpipe badge -->
  <rect x="196" y="300" width="408" height="24" rx="12" fill="#27ae60"/>
  <text x="400" y="317" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Warpipe keeps only the apps you pick linked to Discord</text>
</svg>
